{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Управление сервисом рассылок {% endblock %}</title>

    <script src="{% static 'js/color-modes.js'%}"></script>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-auto bg-auto">
      <div class="container-fluid">
          <a class="navbar-brand" href="#">Сервис рассылок</a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="/home/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/recipient/list/">Получатели</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/message/list/">Сообщения</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Рассылки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Попытки</a>
                </li>
            </ul>
          </div>
      </div>
    </nav>
    <div class="container mt-5">
      {% block content %}{% endblock %}
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
